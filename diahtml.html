<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Facility Network Layout – Delta Phase (v2)</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --border: #cbd5f5;
      --card-bg: #ffffff;
      --room-bg: #f9fafb;
      --mdf-bg: #fff4e5;
      --idf-bg: #e5f2ff;
      --ap-bg: #e0f9ff;
      --server-bg: #ffe0c2;
      --switch-bg: #e0f1ff;
      --router-bg: #e2ffde;
      --fw-bg: #ffd6d6;
      --patch-bg: #f3e0ff;
      --text-main: #111827;
      --text-muted: #4b5563;
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top left, #e5edff, #f3f4f6);
    }

    svg {
      display: block;
      margin: 24px auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
    }

    .frame {
      fill: var(--room-bg);
      stroke: #d1d5db;
      stroke-width: 1.5;
      rx: 16;
      ry: 16;
    }

    .floor-label {
      font-size: 18px;
      font-weight: 700;
      fill: var(--text-main);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      fill: var(--text-main);
    }

    .label {
      font-size: 13px;
      fill: var(--text-muted);
    }

    .label-small {
      font-size: 11px;
      fill: var(--text-muted);
    }

    .room {
      fill: var(--room-bg);
      stroke: var(--border);
      stroke-width: 1.5;
      rx: 12;
      ry: 12;
    }

    .mdf-room {
      fill: var(--mdf-bg);
      stroke: #f59e0b;
      stroke-width: 1.6;
      rx: 14;
      ry: 14;
    }

    .idf-room {
      fill: var(--idf-bg);
      stroke: #60a5fa;
      stroke-width: 1.6;
      rx: 12;
      ry: 12;
    }

    .device {
      fill: var(--card-bg);
      stroke: #9ca3af;
      stroke-width: 1.2;
      rx: 8;
      ry: 8;
    }

    .server {
      fill: var(--server-bg);
    }

    .switch {
      fill: var(--switch-bg);
    }

    .router {
      fill: var(--router-bg);
    }

    .firewall {
      fill: var(--fw-bg);
    }

    .patch {
      fill: var(--patch-bg);
    }

    .ap {
      fill: var(--ap-bg);
      stroke: var(--accent);
      stroke-width: 1.6;
    }

    .rack {
      fill: #e5e7eb;
      stroke: #9ca3af;
      stroke-width: 1.4;
      rx: 6;
      ry: 6;
    }

    .camera {
      fill: #111827;
    }

    .legend-heading {
      font-size: 14px;
      font-weight: 600;
      fill: var(--text-main);
    }

    .legend-text {
      font-size: 11px;
      fill: var(--text-muted);
    }
  </style>
</head>
<body>
  <svg width="1300" height="780" viewBox="0 0 1300 780" aria-label="Facility network layout">

    <!-- Outer rounded frame -->
    <rect x="20" y="20" width="1260" height="740" class="frame" />

    <!-- Floor divider -->
    <line x1="40" y1="400" x2="1240" y2="400" stroke="#e5e7eb" stroke-width="2" />
    <text x="60" y="60" class="floor-label">Floor 2</text>
    <text x="60" y="430" class="floor-label">Floor 1</text>

    <!-- ================= FLOOR 2 ROOMS ================= -->

    <!-- Cerebrum AI Division -->
    <rect x="60" y="90" width="340" height="150" class="room" />
    <text x="80" y="118" class="title">Cerebrum AI Division</text>
    <text x="80" y="140" class="label">Data scientists &amp; ML engineers</text>

    <!-- AP2 -->
    <circle cx="360" cy="150" r="15" class="ap" />
    <path d="M352 150 Q360 142 368 150" fill="none" stroke="#4b5563" stroke-width="1.5" />
    <path d="M348 154 Q360 138 372 154" fill="none" stroke="#9ca3af" stroke-width="1" />
    <text x="338" y="175" class="label-small">AP2</text>
    <text x="240" y="190" class="label-small">
      SSIDs: CEREBRUM-Secure / CEREBRUM-Guest
    </text>

    <!-- Aegis Defense Division -->
    <rect x="430" y="90" width="330" height="150" class="room" />
    <text x="450" y="118" class="title">Aegis Defense Division</text>
    <text x="450" y="140" class="label">Secure R&amp;D / classified projects</text>

    <!-- AP4 -->
    <circle cx="720" cy="150" r="15" class="ap" />
    <path d="M712 150 Q720 142 728 150" fill="none" stroke="#4b5563" stroke-width="1.5" />
    <path d="M708 154 Q720 138 732 154" fill="none" stroke="#9ca3af" stroke-width="1" />
    <text x="698" y="175" class="label-small">AP4</text>
    <text x="540" y="190" class="label-small">
      SSID: AEGIS-Secure (no guest access)
    </text>

    <!-- Helix Integration Division -->
    <rect x="790" y="90" width="330" height="150" class="room" />
    <text x="810" y="118" class="title">Helix Integration Division</text>
    <text x="810" y="140" class="label">Systems integration &amp; testing</text>

    <!-- AP3 -->
    <circle cx="1090" cy="150" r="15" class="ap" />
    <path d="M1082 150 Q1090 142 1098 150" fill="none" stroke="#4b5563" stroke-width="1.5" />
    <path d="M1078 154 Q1090 138 1102 154" fill="none" stroke="#9ca3af" stroke-width="1" />
    <text x="1068" y="175" class="label-small">AP3</text>
    <text x="910" y="190" class="label-small">
      SSIDs: HELIX-Secure / HELIX-Guest
    </text>

    <!-- IDF-1 -->
    <rect x="1130" y="260" width="130" height="120" class="idf-room" />
    <text x="1145" y="285" class="title" style="font-size:14px;">IDF-1 (Floor 2)</text>
    <text x="1145" y="303" class="label-small">Access switches &amp; patch panel</text>

    <rect x="1150" y="315" width="90" height="26" class="device switch" />
    <text x="1155" y="332" class="label-small">AccessSW-F2-A</text>

    <rect x="1150" y="347" width="90" height="22" class="device patch" />
    <text x="1158" y="363" class="label-small">Patch Panel</text>

    <!-- Camera for IDF-1 -->
    <polygon points="1245,262 1230,272 1230,252" class="camera" />
    <rect x="1225" y="257" width="7" height="11" fill="#111827" />

    <!-- ================= MDF / MAIN SERVER ROOM ================= -->

    <rect x="250" y="250" width="800" height="200" class="mdf-room" />
    <text x="270" y="278" class="title">MDF / Main Server Room (Secure)</text>
    <text x="270" y="300" class="label">
      Locked cage with badge access – all core network devices, racks, and Dell R440 servers.
    </text>

    <!-- Racks -->
    <rect x="280" y="310" width="90" height="90" class="rack" />
    <text x="295" y="327" class="label-small">Rack 1</text>

    <rect x="390" y="310" width="90" height="90" class="rack" />
    <text x="405" y="327" class="label-small">Rack 2</text>

    <!-- Core switch -->
    <rect x="290" y="335" width="70" height="28" class="device switch" />
    <text x="294" y="352" class="label-small">CoreSwitch-01</text>
    <text x="292" y="368" class="label-small">(Catalyst 2960X)</text>

    <!-- Routers -->
    <rect x="400" y="330" width="80" height="26" class="device router" />
    <text x="405" y="347" class="label-small">ISR-4321-A</text>

    <rect x="400" y="362" width="80" height="26" class="device router" />
    <text x="405" y="379" class="label-small">ISR-4321-B</text>

    <!-- Firewall -->
    <rect x="500" y="330" width="100" height="28" class="device firewall" />
    <text x="505" y="348" class="label-small">Cisco Firepower 1010</text>

    <!-- Main patch panel -->
    <rect x="500" y="366" width="100" height="24" class="device patch" />
    <text x="507" y="383" class="label-small">Main Patch Panel</text>

    <!-- Dell servers -->
    <rect x="630" y="330" width="80" height="28" class="device server" />
    <text x="637" y="347" class="label-small">R440-01</text>

    <rect x="725" y="330" width="80" height="28" class="device server" />
    <text x="732" y="347" class="label-small">R440-02</text>

    <text x="630" y="366" class="label-small">
      Dell PowerEdge R440 – VMs, DB, application services
    </text>

    <!-- Camera in MDF -->
    <polygon points="1010,260 995,270 995,250" class="camera" />
    <rect x="990" y="255" width="7" height="11" fill="#111827" />
    <text x="1000" y="290" class="label-small">Camera</text>

    <!-- ================= FLOOR 1 ROOMS ================= -->

    <!-- Orion Operations Division -->
    <rect x="60" y="450" width="340" height="150" class="room" />
    <text x="80" y="478" class="title">Orion Operations Division</text>
    <text x="80" y="500" class="label">NOC / daily operations</text>

    <!-- AP1 -->
    <circle cx="360" cy="520" r="15" class="ap" />
    <path d="M352 520 Q360 512 368 520" fill="none" stroke="#4b5563" stroke-width="1.5" />
    <path d="M348 524 Q360 508 372 524" fill="none" stroke="#9ca3af" stroke-width="1" />
    <text x="338" y="545" class="label-small">AP1</text>
    <text x="235" y="560" class="label-small">
      SSIDs: ORION-Secure / ORION-Guest
    </text>

    <!-- Sentinel Security Division -->
    <rect x="430" y="450" width="330" height="150" class="room" />
    <text x="450" y="478" class="title">Sentinel Security Division</text>
    <text x="450" y="500" class="label">Blue team, SOC monitoring</text>

    <!-- AP5 -->
    <circle cx="720" cy="520" r="15" class="ap" />
    <path d="M712 520 Q720 512 728 520" fill="none" stroke="#4b5563" stroke-width="1.5" />
    <path d="M708 524 Q720 508 732 524" fill="none" stroke="#9ca3af" stroke-width="1" />
    <text x="698" y="545" class="label-small">AP5</text>
    <text x="510" y="560" class="label-small">
      SSIDs: SENTINEL-Secure / SENTINEL-Guest
    </text>

    <!-- Executive Command & SysAdmin -->
    <rect x="790" y="450" width="330" height="150" class="room" />
    <text x="810" y="478" class="title">Executive Command &amp; SysAdmin</text>
    <text x="810" y="500" class="label">Exec offices, command, administrators</text>
    <text x="810" y="520" class="label-small">
      Primary owner: Shawn &nbsp;&nbsp;•&nbsp;&nbsp; Support: Jeremi Taylor
    </text>

    <!-- IDF-2 -->
    <rect x="1130" y="450" width="130" height="150" class="idf-room" />
    <text x="1145" y="477" class="title" style="font-size:14px;">IDF-2 (Floor 1)</text>
    <text x="1145" y="495" class="label-small">Access switches &amp; patch panel</text>

    <rect x="1150" y="508" width="90" height="26" class="device switch" />
    <text x="1155" y="525" class="label-small">AccessSW-F1-A</text>

    <rect x="1150" y="540" width="90" height="22" class="device patch" />
    <text x="1158" y="556" class="label-small">Patch Panel</text>

    <!-- Camera for IDF-2 -->
    <polygon points="1245,452 1230,462 1230,442" class="camera" />
    <rect x="1225" y="447" width="7" height="11" fill="#111827" />

    <!-- ================= LEGEND ================= -->

    <rect x="940" y="605" width="320" height="135" class="room" />
    <text x="960" y="630" class="legend-heading">Legend &amp; design notes</text>
    <text x="960" y="650" class="legend-text">
      • MDF contains core switch, ISR 4321 routers, Firepower 1010, Dell R440 servers, and main patch panel.
    </text>
    <text x="960" y="667" class="legend-text">
      • IDF-1 / IDF-2 host access switches and local patch panels for each floor.
    </text>
    <text x="960" y="684" class="legend-text">
      • AP1–AP5 placed with ~15–20% overlap between coverage areas for smooth roaming.
    </text>
    <text x="960" y="701" class="legend-text">
      • All MDF/IDF rooms are locked with cameras monitoring entrances for physical security.
    </text>

  </svg>
</body>
</html>
