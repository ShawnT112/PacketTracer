<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Facility Network Layout – Delta Phase (v2)</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --border: #cbd5f5;
      --card-bg: #ffffff;
      --room-bg: #f9fafb;
      --mdf-bg: #fff4e5;
      --idf-bg: #e5f2ff;
      --ap-bg: #e0f9ff;
      --server-bg: #ffe0c2;
      --switch-bg: #e0f1ff;
      --router-bg: #e2ffde;
      --fw-bg: #ffd6d6;
      --patch-bg: #f3e0ff;
      --text-main: #111827;
      --text-muted: #4b5563;
      --accent: #6366f1;
      --vlan-10: #c7f9d2; /* pale green for internal */
      --vlan-20: #e6f2ff; /* pale blue for guest */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #e5edff, #f3f4f6);
    }

    svg { display: block; margin: 24px auto; background: var(--card-bg); border-radius: 16px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25); }

    .frame { fill: var(--room-bg); stroke: #d1d5db; stroke-width: 1.5; rx: 16; ry: 16; }
    .floor-label { font-size: 18px; font-weight: 700; fill: var(--text-main); }
    .title { font-size: 18px; font-weight: 700; fill: var(--text-main); }
    .label { font-size: 13px; fill: var(--text-muted); }
    .label-small { font-size: 11px; fill: var(--text-muted); }

    .room { fill: var(--room-bg); stroke: var(--border); stroke-width: 1.5; rx: 12; ry: 12; }
    .mdf-room { fill: var(--mdf-bg); stroke: #f59e0b; stroke-width: 1.6; rx: 14; ry: 14; }
    .idf-room { fill: var(--idf-bg); stroke: #60a5fa; stroke-width: 1.6; rx: 12; ry: 12; }

    .device { fill: var(--card-bg); stroke: #9ca3af; stroke-width: 1.2; rx: 6; ry: 6; }
    .server { fill: var(--server-bg); stroke: #c47a00; }
    .switch { fill: var(--switch-bg); stroke: #2b6cb0; }
    .router { fill: var(--router-bg); stroke: #15803d; }
    .firewall { fill: var(--fw-bg); stroke: #b00000; }
    .patch { fill: var(--patch-bg); stroke: #7c3aed; }
    .ap { fill: var(--ap-bg); stroke: var(--accent); stroke-width: 1.6; }

    /* Specific device styles */
    .pc { fill: #ffffff; stroke: #374151; stroke-width: 1; rx: 3; ry: 3; }
    .laptop { fill: #ffffff; stroke: #111827; stroke-width: 1; rx: 3; ry: 3; }
    .printer { fill: #ffffff; stroke: #6b7280; stroke-width: 1; rx: 4; ry: 4; }
    .voip { fill: #f1f5f9; stroke: #475569; stroke-width: 1; rx: 4; ry: 4; }

    .dev-label { font-size: 10px; fill: var(--text-main); font-weight: 600; }
    .dev-sub { font-size: 9px; fill: var(--text-muted); }

    .vlan-badge { font-size: 8px; fill: #064e3b; font-weight: 700; }

    .cable {
    stroke: #6b7280;       
    stroke-width: 2;
    stroke-dasharray: 4 2;
    fill: none;
}

    .legend-heading { font-size: 14px; font-weight: 600; fill: var(--text-main); }
    .legend-text { font-size: 11px; fill: var(--text-muted); }
  </style>
</head>
